<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重庆大学野蛮生长跑团</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1E40AF',
            secondary: '#3B82F6',
            accent: '#F59E0B',
            gold: '#FFD700',
            silver: '#C0C0C0',
            bronze: '#CD7F32',
            dark: '#1E293B',
            light: '#F8FAFC'
          }
        }
      }
    }
  </script>
  
  <style>
    .card-hover {
      transition: all 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    .tab-active {
      border-bottom: 3px solid #1E40AF;
      color: #1E40AF;
      font-weight: 600;
    }
    .modal-overlay {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }
    .rank-badge {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-weight: bold;
      font-size: 14px;
    }
    .rank-1 { background: linear-gradient(135deg, #FFD700, #FFA500); color: white; }
    .rank-2 { background: linear-gradient(135deg, #C0C0C0, #A0A0A0); color: white; }
    .rank-3 { background: linear-gradient(135deg, #CD7F32, #8B4513); color: white; }
    .rank-other { background: #E5E7EB; color: #374151; }
    
    .loading-spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #1E40AF;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gray-50 text-dark min-h-screen">
  <!-- 顶部导航 -->
  <header class="sticky top-0 z-40 bg-white shadow-sm">
    <div class="container mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center">
            <i class="fa fa-bolt text-white text-xl"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold text-primary">野蛮生长跑团</h1>
            <p class="text-xs text-gray-500">重庆大学</p>
          </div>
        </div>
        <nav class="hidden md:flex space-x-6">
          <a href="#rankings" class="text-gray-600 hover:text-primary transition-colors">成绩排名</a>
          <a href="#members" class="text-gray-600 hover:text-primary transition-colors">全部成员</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="container mx-auto px-4 py-8">
    <!-- 文件上传区域 -->
    <section class="mb-8 bg-white rounded-xl shadow-sm p-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h2 class="text-lg font-semibold mb-1">数据导入</h2>
          <p class="text-sm text-gray-500">上传CSV文件以加载跑团成绩数据</p>
        </div>
        <div class="flex items-center gap-4">
          <label class="cursor-pointer bg-primary text-white px-6 py-2 rounded-lg hover:bg-primary/90 transition-colors flex items-center gap-2">
            <i class="fa fa-upload"></i>
            <span>选择CSV文件</span>
            <input type="file" id="csvFile" accept=".csv" class="hidden">
          </label>
          <button id="loadSample" class="text-primary hover:text-secondary transition-colors text-sm underline">
            加载示例数据
          </button>
        </div>
      </div>
      <div id="fileInfo" class="mt-4 text-sm text-gray-600 hidden">
        <i class="fa fa-check-circle text-green-500 mr-2"></i>
        <span id="fileName"></span> - 已加载 <span id="memberCount"></span> 名成员数据
      </div>
    </section>

    <!-- 统计卡片 -->
    <section id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-white rounded-xl shadow-sm p-6 card-hover">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm text-gray-500 mb-1">总成员</p>
            <p id="statTotal" class="text-2xl font-bold text-primary">--</p>
          </div>
          <div class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center">
            <i class="fa fa-users text-primary text-xl"></i>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-6 card-hover">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm text-gray-500 mb-1">全马最佳</p>
            <p id="statFullBest" class="text-2xl font-bold text-accent">--</p>
          </div>
          <div class="w-12 h-12 bg-accent/10 rounded-full flex items-center justify-center">
            <i class="fa fa-trophy text-accent text-xl"></i>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-6 card-hover">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm text-gray-500 mb-1">半马最佳</p>
            <p id="statHalfBest" class="text-2xl font-bold text-secondary">--</p>
          </div>
          <div class="w-12 h-12 bg-secondary/10 rounded-full flex items-center justify-center">
            <i class="fa fa-flag-checkered text-secondary text-xl"></i>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-6 card-hover">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm text-gray-500 mb-1">10K最佳</p>
            <p id="stat10kBest" class="text-2xl font-bold text-green-600">--</p>
          </div>
          <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
            <i class="fa fa-clock-o text-green-600 text-xl"></i>
          </div>
        </div>
      </div>
    </section>

    <!-- 排名区域 -->
    <section id="rankings" class="bg-white rounded-xl shadow-sm overflow-hidden mb-8">
      <div class="p-6 border-b">
        <h2 class="text-xl font-bold">成绩排名</h2>
        <p class="text-sm text-gray-500 mt-1">点击队员行可查看详细信息</p>
      </div>
      
      <!-- 标签切换 -->
      <div class="flex border-b">
        <button class="tab-btn tab-active flex-1 py-4 text-center transition-colors" data-tab="full">
          <i class="fa fa-road mr-2"></i>全程马拉松
        </button>
        <button class="tab-btn flex-1 py-4 text-center text-gray-500 hover:text-primary transition-colors" data-tab="half">
          <i class="fa fa-map-marker mr-2"></i>半程马拉松
        </button>
        <button class="tab-btn flex-1 py-4 text-center text-gray-500 hover:text-primary transition-colors" data-tab="10k">
          <i class="fa fa-flash mr-2"></i>10公里
        </button>
      </div>

      <!-- 搜索框 -->
      <div class="p-4 border-b bg-gray-50">
        <div class="relative max-w-md">
          <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" id="searchInput" placeholder="搜索队员姓名..." 
                 class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50">
        </div>
      </div>

      <!-- 排名表格 -->
      <div id="rankingContent" class="overflow-x-auto">
        <div class="p-12 text-center text-gray-500">
          <i class="fa fa-cloud-upload text-4xl mb-4"></i>
          <p>请上传CSV文件或加载示例数据</p>
        </div>
      </div>
    </section>

    <!-- 全部成员 -->
    <section id="members" class="bg-white rounded-xl shadow-sm overflow-hidden">
      <div class="p-6 border-b">
        <h2 class="text-xl font-bold">全部成员</h2>
        <p class="text-sm text-gray-500 mt-1">跑团所有注册成员列表</p>
      </div>
      <div id="memberGrid" class="p-6">
        <div class="text-center text-gray-500 py-8">
          <i class="fa fa-users text-4xl mb-4"></i>
          <p>请上传CSV文件或加载示例数据</p>
        </div>
      </div>
    </section>
  </main>

  <!-- 队员详情模态框 -->
  <div id="memberModal" class="fixed inset-0 z-50 hidden">
    <div class="modal-overlay absolute inset-0" id="modalOverlay"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto relative">
        <button id="closeModal" class="absolute right-4 top-4 w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition-colors">
          <i class="fa fa-times text-gray-600"></i>
        </button>
        <div id="modalContent" class="p-6">
          <!-- 动态填充 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 加载提示 -->
  <div id="loadingOverlay" class="fixed inset-0 z-50 bg-white/80 flex items-center justify-center hidden">
    <div class="text-center">
      <div class="loading-spinner mx-auto mb-4"></div>
      <p class="text-gray-600">正在加载数据...</p>
    </div>
  </div>

  <script>
    // 全局数据存储
    let membersData = [];
    let currentTab = 'full';

    // 时间转换为秒数（用于排序）
    function timeToSeconds(timeStr) {
      if (!timeStr || timeStr === '无' || timeStr === '' || timeStr === 'null') return Infinity;
      
      // 清理字符串
      timeStr = String(timeStr).trim();
      
      // 处理各种格式
      // 格式: 2:21:00, 2.21.00, 2:21, 1:23:22, 38:13:00 等
      let parts;
      
      if (timeStr.includes(':')) {
        parts = timeStr.split(':').map(p => parseFloat(p) || 0);
      } else if (timeStr.includes('.')) {
        parts = timeStr.split('.').map(p => parseFloat(p) || 0);
      } else {
        return Infinity;
      }
      
      if (parts.length === 3) {
        return parts[0] * 3600 + parts[1] * 60 + parts[2];
      } else if (parts.length === 2) {
        // 判断是 小时:分钟 还是 分钟:秒
        if (parts[0] < 10) {
          // 可能是 小时:分钟 格式 (如 2:21 表示 2小时21分)
          return parts[0] * 3600 + parts[1] * 60;
        } else {
          // 可能是 分钟:秒 格式
          return parts[0] * 60 + parts[1];
        }
      }
      
      return Infinity;
    }

    // 格式化时间显示
    function formatTime(timeStr) {
      if (!timeStr || timeStr === '无' || timeStr === '' || timeStr === 'null') return '--';
      return String(timeStr).trim();
    }

    // 解析CSV数据
    function parseCSVData(results) {
      const data = results.data;
      if (data.length < 3) return []; // 至少需要表头和数据行
      
      const members = [];
      
      // 从第3行开始是实际数据（第1行是表头，第2行是示例）
      for (let i = 2; i < data.length; i++) {
        const row = data[i];
        if (!row || !row[1] || row[1].trim() === '' || row[1] === 'XXX') continue;
        
        const member = {
          id: row[0] || i,
          name: row[1] || '',
          sponsorType: row[2] || '',
          bestFull: row[3] || '',
          bestFullEvent: row[4] || '',
          bestHalf: row[5] || '',
          bestHalfEvent: row[6] || '',
          best10k: row[7] || '',
          best10kEvent: row[8] || '',
          gender: row[9] || '',
          enrollYear: row[10] || '',
          major: row[11] || '',
          phone: row[12] || '',
          recent1Result: row[13] || '',
          recent1Event: row[14] || '',
          recent1Date: row[15] || '',
          recent2Result: row[16] || '',
          recent2Event: row[17] || '',
          recent2Date: row[18] || '',
          recent3Result: row[19] || '',
          recent3Event: row[20] || '',
          recent3Date: row[21] || ''
        };
        
        members.push(member);
      }
      
      return members;
    }

    // 更新统计数据
    function updateStats() {
      document.getElementById('statTotal').textContent = membersData.length;
      
      // 全马最佳
      const fullTimes = membersData
        .map(m => ({ time: m.bestFull, seconds: timeToSeconds(m.bestFull) }))
        .filter(t => t.seconds !== Infinity)
        .sort((a, b) => a.seconds - b.seconds);
      document.getElementById('statFullBest').textContent = fullTimes.length > 0 ? formatTime(fullTimes[0].time) : '--';
      
      // 半马最佳
      const halfTimes = membersData
        .map(m => ({ time: m.bestHalf, seconds: timeToSeconds(m.bestHalf) }))
        .filter(t => t.seconds !== Infinity)
        .sort((a, b) => a.seconds - b.seconds);
      document.getElementById('statHalfBest').textContent = halfTimes.length > 0 ? formatTime(halfTimes[0].time) : '--';
      
      // 10K最佳
      const tenKTimes = membersData
        .map(m => ({ time: m.best10k, seconds: timeToSeconds(m.best10k) }))
        .filter(t => t.seconds !== Infinity)
        .sort((a, b) => a.seconds - b.seconds);
      document.getElementById('stat10kBest').textContent = tenKTimes.length > 0 ? formatTime(tenKTimes[0].time) : '--';
    }

    // 获取排名徽章样式
    function getRankBadge(rank) {
      if (rank === 1) return 'rank-1';
      if (rank === 2) return 'rank-2';
      if (rank === 3) return 'rank-3';
      return 'rank-other';
    }

    // 渲染排名表格
    function renderRankings(searchTerm = '') {
      let sortedData;
      let timeField, eventField;
      
      switch(currentTab) {
        case 'full':
          timeField = 'bestFull';
          eventField = 'bestFullEvent';
          break;
        case 'half':
          timeField = 'bestHalf';
          eventField = 'bestHalfEvent';
          break;
        case '10k':
          timeField = 'best10k';
          eventField = 'best10kEvent';
          break;
      }
      
      // 过滤有成绩的成员
      sortedData = membersData
        .filter(m => timeToSeconds(m[timeField]) !== Infinity)
        .filter(m => !searchTerm || m.name.toLowerCase().includes(searchTerm.toLowerCase()))
        .map(m => ({
          ...m,
          sortSeconds: timeToSeconds(m[timeField])
        }))
        .sort((a, b) => a.sortSeconds - b.sortSeconds);
      
      const container = document.getElementById('rankingContent');
      
      if (sortedData.length === 0) {
        container.innerHTML = `
          <div class="p-12 text-center text-gray-500">
            <i class="fa fa-search text-4xl mb-4"></i>
            <p>暂无符合条件的数据</p>
          </div>
        `;
        return;
      }
      
      let html = `
        <table class="w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600 w-20">排名</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">姓名</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">性别</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">最佳成绩</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">赛事</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">专业</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      sortedData.forEach((member, index) => {
        const rank = index + 1;
        html += `
          <tr class="border-b hover:bg-blue-50 cursor-pointer transition-colors" onclick="showMemberDetail('${member.id}')">
            <td class="px-4 py-4">
              <span class="rank-badge ${getRankBadge(rank)}">${rank}</span>
            </td>
            <td class="px-4 py-4 font-medium">${member.name}</td>
            <td class="px-4 py-4">
              <span class="px-2 py-1 rounded text-xs ${member.gender === '男' ? 'bg-blue-100 text-blue-600' : 'bg-pink-100 text-pink-600'}">
                ${member.gender || '--'}
              </span>
            </td>
            <td class="px-4 py-4 font-semibold text-accent">${formatTime(member[timeField])}</td>
            <td class="px-4 py-4 text-sm text-gray-600">${member[eventField] || '--'}</td>
            <td class="px-4 py-4 text-sm text-gray-600">${member.major || '--'}</td>
          </tr>
        `;
      });
      
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    // 渲染成员网格
    function renderMemberGrid() {
      const container = document.getElementById('memberGrid');
      
      if (membersData.length === 0) {
        container.innerHTML = `
          <div class="text-center text-gray-500 py-8">
            <i class="fa fa-users text-4xl mb-4"></i>
            <p>请上传CSV文件或加载示例数据</p>
          </div>
        `;
        return;
      }
      
      let html = '<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">';
      
      membersData.forEach(member => {
        html += `
          <div class="bg-gray-50 rounded-lg p-4 card-hover cursor-pointer" onclick="showMemberDetail('${member.id}')">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
                <i class="fa fa-user text-primary"></i>
              </div>
              <div>
                <p class="font-medium">${member.name}</p>
                <p class="text-xs text-gray-500">${member.enrollYear || '--'}级 ${member.gender || ''}</p>
              </div>
            </div>
          </div>
        `;
      });
      
      html += '</div>';
      container.innerHTML = html;
    }

    // 显示成员详情
    function showMemberDetail(memberId) {
      const member = membersData.find(m => String(m.id) === String(memberId));
      if (!member) return;
      
      const modal = document.getElementById('memberModal');
      const content = document.getElementById('modalContent');
      
      content.innerHTML = `
        <div class="text-center mb-6">
          <div class="w-20 h-20 rounded-full bg-primary/10 flex items-center justify-center mx-auto mb-4">
            <i class="fa fa-user text-primary text-3xl"></i>
          </div>
          <h3 class="text-2xl font-bold">${member.name}</h3>
          <p class="text-gray-500">${member.enrollYear || '--'}级 · ${member.major || '--'}</p>
        </div>
        
        <div class="grid grid-cols-2 gap-4 mb-6">
          <div class="bg-gray-50 rounded-lg p-4">
            <p class="text-sm text-gray-500 mb-1">性别</p>
            <p class="font-medium">${member.gender || '--'}</p>
          </div>
          <div class="bg-gray-50 rounded-lg p-4">
            <p class="text-sm text-gray-500 mb-1">联系电话</p>
            <p class="font-medium">${member.phone || '--'}</p>
          </div>
        </div>
        
        <div class="mb-6">
          <h4 class="font-semibold mb-3 flex items-center">
            <i class="fa fa-trophy text-accent mr-2"></i>个人最佳成绩
          </h4>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div class="border rounded-lg p-4">
              <p class="text-xs text-gray-500 mb-1">全程马拉松</p>
              <p class="text-lg font-bold text-primary">${formatTime(member.bestFull)}</p>
              <p class="text-xs text-gray-400 mt-1">${member.bestFullEvent || '--'}</p>
            </div>
            <div class="border rounded-lg p-4">
              <p class="text-xs text-gray-500 mb-1">半程马拉松</p>
              <p class="text-lg font-bold text-secondary">${formatTime(member.bestHalf)}</p>
              <p class="text-xs text-gray-400 mt-1">${member.bestHalfEvent || '--'}</p>
            </div>
            <div class="border rounded-lg p-4">
              <p class="text-xs text-gray-500 mb-1">10公里</p>
              <p class="text-lg font-bold text-green-600">${formatTime(member.best10k)}</p>
              <p class="text-xs text-gray-400 mt-1">${member.best10kEvent || '--'}</p>
            </div>
          </div>
        </div>
        
        <div>
          <h4 class="font-semibold mb-3 flex items-center">
            <i class="fa fa-calendar text-primary mr-2"></i>近期比赛成绩
          </h4>
          <div class="space-y-3">
            ${member.recent1Result ? `
              <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                <div>
                  <p class="font-medium">${member.recent1Event || '--'}</p>
                  <p class="text-xs text-gray-500">${member.recent1Date || '--'}</p>
                </div>
                <span class="font-semibold text-primary">${member.recent1Result}</span>
              </div>
            ` : ''}
            ${member.recent2Result ? `
              <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                <div>
                  <p class="font-medium">${member.recent2Event || '--'}</p>
                  <p class="text-xs text-gray-500">${member.recent2Date || '--'}</p>
                </div>
                <span class="font-semibold text-primary">${member.recent2Result}</span>
              </div>
            ` : ''}
            ${member.recent3Result ? `
              <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                <div>
                  <p class="font-medium">${member.recent3Event || '--'}</p>
                  <p class="text-xs text-gray-500">${member.recent3Date || '--'}</p>
                </div>
                <span class="font-semibold text-primary">${member.recent3Result}</span>
              </div>
            ` : ''}
            ${!member.recent1Result && !member.recent2Result && !member.recent3Result ? '<p class="text-gray-500 text-center py-4">暂无近期比赛记录</p>' : ''}
          </div>
        </div>
      `;
      
      modal.classList.remove('hidden');
    }

    // 加载示例数据
